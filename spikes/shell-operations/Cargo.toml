[package]
name = "backleaf-shell-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "backleaf-shell-probe"
path = "src/verification.rs"

[[bin]]
name = "backleaf-search-probe"
path = "src/search-probe.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
roaring = "=0.12.0"
unicode-segmentation = "1.12"
async-channel = "2"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
debug = 0
