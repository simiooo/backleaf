[package]
name = "backleaf"
version = "0.1.0-preview.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["windows-manifest"] }
gpui_windows = { path = "vendor/zed/crates/gpui_windows", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
unicode-segmentation = "1.12"
async-channel = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
codegen-units = 16
strip = "symbols"

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
