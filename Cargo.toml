[package]
name = "backleaf"
version = "0.1.0-preview.57"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["windows-manifest"] }
gpui_windows = { path = "vendor/zed/crates/gpui_windows", default-features = false }
anyhow = "1"
chrono = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks"] }
unicode-segmentation = "1.12"
async-channel = "2"
raw-window-handle = "0.6"
roaring = "=0.12.0"
accesskit = "=0.24.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
# Win32_System_Registry is required by windows 0.62 to expose SHELLEXECUTEINFOW
# (its HKEY field), which the UAC handoff uses through ShellExecuteExW.
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_Ime", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_Globalization", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry", "Win32_Devices_DeviceAndDriverInstallation"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
codegen-units = 16
strip = "symbols"

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

[build-dependencies]
cc = "1"

[dev-dependencies]
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["test-support"] }
