name: App-local Windows runtime
on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable runtime support release tag
        default: runtime-v2
        required: true
permissions:
  contents: write
jobs:
  runtime:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify Microsoft signatures and package x64 runtime
        shell: pwsh
        env:
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: ./scripts/native/package-runtime.ps1 -RuntimeTag $env:RUNTIME_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: app-local-runtime
          path: .local/runtime-ci
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish verified runtime support asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: |
          gh release create $env:RUNTIME_TAG --draft --prerelease --target $env:GITHUB_SHA --title "Backleaf app-local $env:RUNTIME_TAG (x64)" --notes 'Unmodified Microsoft-signed Visual C++ runtime from the Visual Studio x64 redist directory, for per-user Backleaf deployment. See packaged NOTICE.txt and runtime.json for source, terms and hashes.'
          if ($LASTEXITCODE) { throw 'Runtime draft creation failed; no overwrite is allowed' }
          gh release upload $env:RUNTIME_TAG .local/runtime-ci/Backleaf-runtime-x64.zip .local/runtime-ci/runtime.json
          if ($LASTEXITCODE) { throw 'Runtime asset upload failed' }
          $remote = gh release view $env:RUNTIME_TAG --json assets | ConvertFrom-Json
          foreach ($file in Get-Item .local/runtime-ci/Backleaf-runtime-x64.zip,.local/runtime-ci/runtime.json) {
            $asset = @($remote.assets | Where-Object name -eq $file.Name)
            if ($asset.Count -ne 1 -or $asset[0].digest -ne ('sha256:' + (Get-FileHash $file.FullName).Hash.ToLowerInvariant())) { throw 'Runtime remote digest mismatch' }
          }
          gh release edit $env:RUNTIME_TAG --draft=false
          if ($LASTEXITCODE) { throw 'Runtime publication failed' }
